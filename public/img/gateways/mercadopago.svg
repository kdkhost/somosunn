<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo amarelo oficial do MercadoPago -->
  <rect width="64" height="64" rx="12" fill="#FFE600"/>

  <!-- Handshake centralizado (azul oficial) -->
  <g transform="translate(32, 32)">
    <!-- Elipse externa azul escuro -->
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#009EE3"/>

    <!-- Parte interna clara (sorriso) -->
    <path fill="#FFE600" d="M -18 -2
      C -16 2 -10 6 0 6
      C 10 6 16 2 18 -2
      L 18 -2
      C 16 -8 10 -11 0 -11
      C -10 -11 -16 -8 -18 -2
      Z"/>

    <!-- Olho esquerdo -->
    <circle cx="-9" cy="-4" r="2.2" fill="#009EE3"/>
    <!-- Olho direito -->
    <circle cx="9" cy="-4" r="2.2" fill="#009EE3"/>

    <!-- Handshake (aperto de mão no sorriso) -->
    <path fill="#009EE3" d="M -5 2
      L -3 3
      L -1 2
      L 1 3
      L 3 2
      L 5 3
      L 5 4
      L 3 5
      L 1 4
      L -1 5
      L -3 4
      L -5 5
      Z"/>
  </g>
</svg>
