<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo escuro oficial do SumUp -->
  <rect width="64" height="64" rx="12" fill="#1E242F"/>

  <!-- Letra S oficial: dois semicírculos cortados em diagonal -->
  <g transform="translate(32, 32)">
    <!-- Semicírculo superior (meia-lua virada para direita) -->
    <path fill="#ffffff" d="M 0 -20
      C -11 -20 -20 -11 -20 0
      L -20 0
      C -8 0 4 -6 16 -12
      L 16 -12
      C 13 -17 7 -20 0 -20 Z"/>

    <!-- Semicírculo inferior (meia-lua virada para esquerda) -->
    <path fill="#ffffff" d="M 0 20
      C 11 20 20 11 20 0
      L 20 0
      C 8 0 -4 6 -16 12
      L -16 12
      C -13 17 -7 20 0 20 Z"/>
  </g>
</svg>
