<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fundo escuro oficial do SumUp -->
  <rect width="100" height="100" rx="16" fill="#1E242F"/>

  <!-- Letra "S" oficial do SumUp: dois semicírculos com fenda diagonal -->
  <!-- Semicírculo superior (meia-lua abre para direita) -->
  <path fill="#ffffff" d="M 50 20
    C 33 20 20 33 20 50
    C 28 48 36 44 44 38
    C 52 32 64 28 72 30
    C 68 24 60 20 50 20 Z"/>

  <!-- Semicírculo inferior (meia-lua abre para esquerda) -->
  <path fill="#ffffff" d="M 50 80
    C 67 80 80 67 80 50
    C 72 52 64 56 56 62
    C 48 68 36 72 28 70
    C 32 76 40 80 50 80 Z"/>
</svg>
